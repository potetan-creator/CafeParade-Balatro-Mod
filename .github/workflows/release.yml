name: Cafetro release package

on:
  push:
    branches: [cafeparade-v0.1.0]
    paths:
      - Cafetro/**
      - art/**
      - tests/**
      - tools/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafetro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Test runtime and distribution
        run: python tests/run.py
      - name: Build release ZIP
        id: build
        run: |
          python tools/build_release.py
          release_tag=$(python -c "import json; print('v' + json.load(open('Cafetro/Cafetro.json', encoding='utf-8'))['version'])")
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Cafetro-${{ steps.build.outputs.tag }}
          path: |
            dist/Cafetro-${{ steps.build.outputs.tag }}.zip
            dist/Cafetro-${{ steps.build.outputs.tag }}.sha256
          if-no-files-found: error
      - name: Update draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          draft_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$draft_state" != true ]; then
            echo "No matching draft release; package is available as a workflow artifact."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "dist/Cafetro-${RELEASE_TAG}.zip" "dist/Cafetro-${RELEASE_TAG}.sha256" --clobber
          gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
